<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Triple</title>
<meta name="description" content="Natation, vélo et course : plan d'entraînement, forme, repas et courses.">
<meta name="theme-color" content="#292F36">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Triple">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preload" href="fonts/barlow-condensed-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar" id="topbar">
  <h1 id="title"><span class="brandmark" role="img" aria-label="Triple"><span class="sp" aria-hidden="true"><b></b><b></b><b></b></span><span class="w" aria-hidden="true"><em>TRI</em>PLE</span></span></h1>
  <div class="row">
    <button class="iconbtn" id="sync-btn" aria-label="Synchroniser avec Intervals.icu" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 1-15.5 6.2L3 16"/><path d="M3 12a9 9 0 0 1 15.5-6.2L21 8"/><path d="M21 3v5h-5M3 21v-5h5"/></svg>
    </button>
    <button class="iconbtn" id="layout-btn" aria-label="Organiser les blocs" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h10M4 12h10M4 18h10"/><path d="M19 4v16M16.5 6.5 19 4l2.5 2.5M16.5 17.5 19 20l2.5-2.5"/></svg>
    </button>
    <button class="iconbtn" id="open-settings" aria-label="Réglages et sauvegarde">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 0 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 0 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </div>
</header>

<main id="main">
  <div class="update" id="update-banner" hidden><span>Une nouvelle version de l'app est prête.</span><button class="btn primary" id="update-btn">Mettre à jour</button></div>
  <section class="view" id="view-accueil" data-title="Accueil"></section>
  <section class="view" id="view-entrainement" data-title="Entraînement" hidden></section>
  <section class="view" id="view-suivi" data-title="Suivi" hidden></section>
  <section class="view" id="view-repas" data-title="Repas" hidden></section>
  <section class="view" id="view-courses" data-title="Courses" hidden></section>
</main>

<nav class="tabbar" role="tablist" aria-label="Sections">
  <button class="tab" role="tab" data-tab="accueil" aria-selected="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Accueil</button>
  <button class="tab" role="tab" data-tab="entrainement" aria-selected="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16" rx="2"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/><path d="m8.5 15 2.2 2.2L15.5 13"/></svg>Plan</button>
  <button class="tab" role="tab" data-tab="suivi" aria-selected="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>Suivi</button>
  <button class="tab" role="tab" data-tab="repas" aria-selected="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3v8a2 2 0 0 0 2 2v8M11 3v6M3 3v6a4 4 0 0 0 4 4"/><path d="M17 21V3c2.2 1.2 4 4 4 7.5V14h-4"/></svg>Repas</button>
  <button class="tab" role="tab" data-tab="courses" aria-selected="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/><path d="M2 3h3l2.6 12.2a1.5 1.5 0 0 0 1.5 1.2h8.8a1.5 1.5 0 0 0 1.5-1.1L21 8H6"/></svg>Courses</button>
</nav>

<div id="sheet-root"></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<input type="file" id="import-input" accept="application/json,.json" hidden>

<script src="data.js"></script>
<script src="engine.js"></script>
<script src="demo.js"></script>
<script src="app.js"></script>
</body>
</html>
